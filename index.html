<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="منصة توليد جدول الدورات التدريبية الأسبوعي" />
  <title>منصة توليد جدول الدورات التدريبية - جامعة نايف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
<div id="toast-container"></div>

    <header class="bg-white border-b shadow-sm sticky top-0 z-50 relative">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="#" onclick="showPage('generator')">
                    <img src="https://nauss.edu.sa/Style%20Library/ar-sa/Styles/images/home/Logo.svg" alt="Logo" class="h-20 object-contain"> 
                </a>
            </div>
            <div class="flex justify-end gap-1 md:gap-4">
                <div class="nav-tab active" onclick="resetAndShowGenerator()">
                    <span>➕</span> جدول جديد
                </div>
                <div class="nav-tab" onclick="showPage('archive')">
                    <span>🗂️</span> الجداول المنشأة
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6">
        
        <div id="page-generator" class="page-container active space-y-6">
            
            <div class="flex justify-between items-center">
                 <h2 class="text-lg font-bold text-slate-700">تعبئة البيانات</h2>
                 <button onclick="clearCurrentData()" class="text-xs text-red-500 hover:text-red-700 font-semibold flex items-center gap-1">
                     <span>🗑️</span> مسح البيانات
                 </button>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-4 border grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-3">
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="text-xs text-slate-500 block mb-1">رقم الأسبوع</label>
                            <input type="number" id="w-id" class="form-input text-center font-bold border-slate-300" value="1">
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-slate-500 block mb-1">الموظف المسؤول</label>
                            <select id="owner-select" class="form-input text-center font-bold border-slate-300">
                                <option value="" selected disabled>اختر</option>
                                <option value="نايف الشهراني">نايف الشهراني</option>
                                <option value="مزنة آل محمود">مزنة آل محمود</option>
                                <option value="وليد السليم">وليد السليم</option>
                                <option value="خازم الأسمري">خازم الأسمري</option>
                                <option value="فؤاد نعمان">فؤاد نعمان</option>
                                <option value="عبدالمحسن العنزي">عبدالمحسن العنزي</option>
                                <option value="بشاير الطحيني">بشاير الطحيني</option>
                                <option value="يعقوب الشمري">يعقوب الشمري</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="text-xs text-slate-500 block mb-1">استيراد جدول</label>
                            <label class="form-input text-center cursor-pointer text-xs flex items-center justify-center border-slate-200 hover:bg-slate-50">
                                📤 رفع
                                <input type="file" id="x-f" class="hidden" accept=".xlsx,.xls" onchange="rdExcel(event)">
                            </label>
                        </div>
                        <div class="flex-1">
                             <label class="text-xs text-slate-500 block mb-1">قالب Excel</label>
                             <button onclick="dlTpl()" class="form-input text-center text-xs hover:bg-slate-50">📥 تحميل</button>
                        </div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="addRow()" class="btn-main flex-1 text-sm justify-center">+ إضافة دورة</button>
                    </div>
                </div>

                <div class="col-span-2">
                    <label class="text-xs font-bold text-slate-600 block mb-2">اختر نمط التصميم</label>
                    <div class="grid grid-cols-4 md:grid-cols-7 xl:grid-cols-[repeat(13,minmax(0,1fr))] gap-2">
                        <div onclick="selectTemplate(1)" class="template-thumb selected" id="tpl-1">
                            <div class="w-full h-full bg-gradient-to-br from-white to-slate-50 flex items-center justify-center text-[#2c6060] text-[7px] font-bold border-b-4 border-[#2c6060]">MODERN</div>
                        </div>
                        <div onclick="selectTemplate(2)" class="template-thumb" id="tpl-2">
                            <div class="w-full h-full bg-[#016564] flex items-center justify-center text-[#d0b284] text-[7px] font-bold">LUXURY</div>
                        </div>
                        <div onclick="selectTemplate(3)" class="template-thumb" id="tpl-3">
                            <div class="w-full h-full bg-gradient-to-r from-teal-500 to-blue-500 flex items-center justify-center text-white text-[7px] font-bold">VIBRANT</div>
                        </div>
                        <div onclick="selectTemplate(4)" class="template-thumb" id="tpl-4">
                            <div class="w-full h-full bg-[#f5f5f7] flex items-center justify-center text-[#1d1d1f] text-[7px] font-bold">iOS</div>
                        </div>
                        <div onclick="selectTemplate(5)" class="template-thumb" id="tpl-5">
                            <div class="w-full h-full bg-[#f0e6d2] flex items-center justify-center text-[#5d4037] text-[7px] font-bold border-2 border-[#c4a77d]">FORMAL</div>
                        </div>
                        <div onclick="selectTemplate(6)" class="template-thumb" id="tpl-6">
                            <div class="w-full h-full bg-gradient-to-br from-[#016564] to-[#498983] flex items-center justify-center text-white text-[7px] font-bold border-2 border-white/50">GLASS</div>
                        </div>
                        <div onclick="selectTemplate(8)" class="template-thumb" id="tpl-8">
                            <div class="w-full h-full bg-[#f7faf8] flex items-center justify-center text-[#016564] text-[7px] font-bold border-l-4 border-[#d0b284]">N8N</div>
                        </div>
                        <div onclick="selectTemplate(9)" class="template-thumb" id="tpl-9">
                            <div class="w-full h-full bg-[#013c3b] flex items-center justify-center text-[#d0b284] text-[7px] font-bold border-t-4 border-[#d0b284]">N9N</div>
                        </div>
                        <div onclick="selectTemplate(10)" class="template-thumb" id="tpl-10">
                            <div class="w-full h-full bg-[#f3f6f4] flex items-center justify-center text-[#123f3d] text-[7px] font-bold border-r-4 border-[#016564]">OPS</div>
                        </div>
                        <div onclick="selectTemplate(11)" class="template-thumb" id="tpl-11">
                            <div class="w-full h-full bg-[#fffaf0] flex items-center justify-center text-[#7a5a24] text-[7px] font-bold border-b-4 border-[#d0b284]">LINE</div>
                        </div>
                        <div onclick="selectTemplate(12)" class="template-thumb" id="tpl-12">
                            <div class="w-full h-full bg-[#f8f4ea] flex items-center justify-center text-[#0d3d3c] text-[7px] font-bold border-t-[10px] border-[#0d3d3c]">REF 1</div>
                        </div>
                        <div onclick="selectTemplate(13)" class="template-thumb" id="tpl-13">
                            <div class="w-full h-full bg-[#fbfaf6] flex items-center justify-center text-[#d0b284] text-[7px] font-bold border-b-[10px] border-[#0d3d3c]">REF 2</div>
                        </div>
                        <div onclick="selectTemplate(14)" class="template-thumb" id="tpl-14">
                            <div class="w-full h-full bg-[#f7f3e9] flex items-center justify-center text-[#0d3d3c] text-[7px] font-bold border-r-[10px] border-[#d0b284]">REF 3</div>
                        </div>
                    </div>

                    <div class="mt-4 bg-slate-50 border rounded-lg p-3 space-y-2">
                        <label class="text-xs font-bold text-slate-600 block">النص التمهيدي لصور العرض</label>
                        <select id="intro-mode" class="form-input text-xs" onchange="handleIntroModeChange()">
                            <option value="default" selected>العبارة الافتراضية لبرنامج الشراكات الدولية بوزارة الداخلية</option>
                            <option value="custom">نص مخصص</option>
                            <option value="none">بدون نص تمهيدي</option>
                        </select>
                        <textarea id="intro-custom" class="form-input text-xs hidden min-h-[78px] resize-y" oninput="saveIntroSettings()" placeholder="اكتب النص التمهيدي الذي سيظهر في صور العرض"></textarea>
                    </div>
                    
                    <!-- Separated Buttons -->
                    <div class="mt-4 space-y-2">
                        <!-- Row 1: Screens -->
                        <div class="flex gap-2 items-center">
                            <button onclick="startScreenSave()" class="flex-1 btn-main text-sm justify-center bg-slate-600"> 🖼️ توليد صور العرض </button>
                            <button id="btn-share-screen" onclick="shareScreenImages()" title="شارك مع شاشة مدخل المبنى" class="btn-icon">📤</button>
                        </div>
                        <!-- Row 2: Report -->
                        <div class="flex gap-2 items-center">
                            <button onclick="startAgentReport()" class="flex-1 btn-main text-sm justify-center bg-[#016564]"> 📄 توليد تقرير الوكيل </button>
                            <button id="btn-share-report" onclick="shareAgentReport()" title="شارك مع الوكيل" class="btn-icon">📤</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="rows-box" class="space-y-2 pb-4"></div>

        </div>

        <div id="page-archive" class="page-container">
            <div class="bg-white rounded-xl shadow-sm p-6 min-h-[60vh]">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-[#2c6060]">الجداول المنشأة سابقاً</h2>
                </div>
                <div id="archive-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                <div id="no-archive" class="text-center text-slate-400 py-10 hidden">لا توجد بيانات مؤرشفة.</div>
            </div>
        </div>

    </main>

    <footer class="bg-white border-t mt-auto py-4 text-center text-sm text-slate-500">
        <div class="font-bold text-slate-700">جميع الحقوق محفوظة Nalshahrani 2026</div>
    </footer>

    <div id="loader" class="fixed inset-0 bg-white/95 z-[100] hidden flex-col items-center justify-center gap-4">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-[#2c6060] rounded-full animate-spin"></div>
        <span id="loader-text" class="font-bold text-slate-600">جاري التوليد...</span>
    </div>

    <script src="./src/app.js"></script>
</body>
</html>
